<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise Buttons</title>
    <style>
      /* EXERCISE 1: Jumia Add to Cart */
      .jumia-btn {
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        background: #f68b1e;
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .jumia-btn:hover {
        background: #e07c16;
      }
      .jumia-btn:active {
        transform: scale(0.96);
      }

      /* EXERCISE 2: Alibaba Add to Cart */
      .alibaba-btn {
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        background: #ff6a00;
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .alibaba-btn:hover {
        background: #e65f00;
      }
      .alibaba-btn:active {
        transform: scale(0.96);
      }

      /* EXERCISE 3: Apple Buy Button */
      .apple-btn {
        padding: 12px 28px;
        border: none;
        border-radius: 12px;
        background: #0071e3;
        color: #ffffff;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .apple-btn:hover {
        background: #0077ed;
      }
      .apple-btn:active {
        transform: scale(0.97);
      }

      /* EXERCISE 4: Spotify Play Button */
      .spotify-btn {
        padding: 12px 32px;
        border: none;
        border-radius: 500px;
        background: #1ed760;
        color: #000000;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .spotify-btn:hover {
        background: #1fdf64;
        transform: scale(1.02);
      }
      .spotify-btn:active {
        transform: scale(0.97);
      }

      /* EXERCISE 5: Twitter/X Post Button */
      .twitter-btn {
        padding: 12px 24px;
        border: none;
        border-radius: 30px;
        background: #1d9bf0;
        color: #ffffff;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .twitter-btn:hover {
        background: #1a8cd8;
      }
      .twitter-btn:active {
        transform: scale(0.95);
      }
    </style>
  </head>
  <body>
    <button class="jumia-btn">Add to Cart</button>
    <button class="alibaba-btn">Add to Cart</button>
    <button class="apple-btn">Buy</button>
    <button class="spotify-btn">Play</button>
    <button class="twitter-btn">Post</button>
  </body>
</html>
