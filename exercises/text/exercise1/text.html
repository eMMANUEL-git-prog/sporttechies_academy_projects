<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Exercise</title>
    <style>
      p {
        font-family: Arial;
        margin-top: 0;
        margin-bottom: 0;
      }

      .title {
        font-weight: bold;
        font-size: 22px;
        width: 300px;
        line-height: 28px;
        margin-bottom: 8px;
        color: rgb(0, 0, 0);
      }

      .stats {
        color: rgb(96, 96, 96);
        font-size: 14px;
        margin-bottom: 16px;
      }

      .author {
        color: rgb(0, 150, 0);
        font-size: 15px;
        margin-bottom: 18px;
      }

      .description {
        color: rgb(50, 50, 50);
        font-size: 14px;
        width: 300px;
        line-height: 22px;
        margin-bottom: 80px;
      }

      .promo {
        font-size: 14px;
        background-color: rgb(220, 40, 40);
        color: white;
        padding-top: 16px;
        padding-bottom: 16px;
        text-align: center;
        margin-bottom: 40px;
        border-radius: 4px;
      }

      .link {
        cursor: pointer;
        font-weight: bold;
      }

      .link:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <p class="title">The Midnight Library</p>

    <p class="stats">4.8 &#9733; · 3 months ago</p>

    <p class="author">Matt Haig &#10003;</p>

    <p class="description">
      A woman explores alternate versions of her life through a magical library.
      <br />
      A New York Times bestseller.
    </p>

    <p class="promo">
      Get the ebook for $9.99 &middot; Limited time. <br />
      <span class="link">Buy Now &rarr;</span>
    </p>
  </body>
</html>
