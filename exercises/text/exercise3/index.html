<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text & Buttons Exercise</title>
    <style>
      p {
        font-family: Arial;
        margin-top: 0;
        margin-bottom: 0;
      }

      .product-title {
        font-weight: bold;
        font-size: 20px;
        width: 320px;
        line-height: 26px;
        margin-bottom: 8px;
        color: rgb(0, 0, 0);
      }

      .rating {
        color: rgb(96, 96, 96);
        font-size: 14px;
        margin-bottom: 14px;
      }

      .brand {
        color: rgb(0, 112, 243);
        font-size: 14px;
        margin-bottom: 16px;
      }

      .desc {
        color: rgb(50, 50, 50);
        font-size: 14px;
        width: 320px;
        line-height: 22px;
        margin-bottom: 18px;
      }

      .price {
        font-size: 26px;
        font-weight: bold;
        color: rgb(0, 0, 0);
        margin-bottom: 20px;
      }

      .price s {
        font-size: 16px;
        font-weight: normal;
        color: rgb(150, 150, 150);
        margin-left: 12px;
      }

      .btn-primary {
        padding: 12px 32px;
        border: none;
        border-radius: 30px;
        background: #1d9bf0;
        color: #ffffff;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s ease;
        margin-right: 12px;
      }

      .btn-primary:hover {
        background: #1a8cd8;
      }

      .btn-primary:active {
        transform: scale(0.95);
      }

      .btn-secondary {
        padding: 12px 32px;
        border: 2px solid #1d9bf0;
        border-radius: 30px;
        background: transparent;
        color: #1d9bf0;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .btn-secondary:hover {
        background: #1d9bf0;
        color: #ffffff;
      }

      .btn-secondary:active {
        transform: scale(0.95);
      }

      .offer {
        font-size: 14px;
        background-color: rgb(0, 110, 212);
        color: white;
        padding-top: 16px;
        padding-bottom: 16px;
        text-align: center;
        margin-top: 28px;
        width: 400px;
      }

      .offer-link {
        cursor: pointer;
        font-weight: bold;
      }

      .offer-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <p class="product-title">Wireless Noise-Cancelling Headphones Pro</p>

    <p class="rating">4.9 &#9733; · 2.5K ratings · 1 month ago</p>

    <p class="brand">SoundMaster &#10003;</p>

    <p class="desc">
      Premium over-ear headphones with active noise cancellation, 40-hour
      battery life, and ultra-comfortable memory foam ear cushions.
    </p>

    <p class="price">$79.99 <s>$129.99</s></p>

    <button class="btn-primary">Buy Now</button>
    <button class="btn-secondary">Add to Cart</button>

    <p class="offer">
      Free 2-day shipping on orders over $50 ·
      <span class="offer-link">Shop all deals &#62;</span>
    </p>
  </body>
</html>
