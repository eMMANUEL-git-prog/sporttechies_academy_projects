<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text</title>
    <style>
      .views {
        color: rgb(96, 96, 96);
        font-size: 14px;
        margin-bottom: 18px;
      }

      p {
        font-family: Arial;
        margin-top: 0;
        margin-bottom: 0;
      }

      .title {
        font-weight: bold;
        font-size: 18px;
        width: 300px;
        line-height: 25px;
        margin-bottom: 6px;
      }

      .checkmark {
        color: rgb(96, 96, 96);
        font-size: 14px;
        margin-bottom: 18px;
      }

      .description {
        color: rgb(96, 96, 96);
        font-size: 14px;
        width: 300px;
        line-height: 25px;
        margin-bottom: 100px;
      }

      .shipping {
        font-size: 14px;
        background-color: rgb(0, 110, 212);
        color: white;
        padding-top: 18px;
        padding-bottom: 18px;
        text-align: center;
        margin-bottom: 42px;
      }

      .shop {
        cursor: pointer;
      }

      .shop:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <p class="title">Best running shoes for spring marathons. Early access!</p>

    <p class="views">4.2K views &#183; 2 months ago</p>

    <p class="checkmark">RunnerMKT &#10003;</p>

    <p class="description">
      We tested 12 pairs of carbon-plated runners. The new ZoomX Vaporfly wins
      again. Limited stock for members!
    </p>

    <p class="shipping">
      Free shipping on orders over Ksh.20,000 · Ends Sunday.
      <span class="shop">Shop Now &#62;</span>
    </p>
  </body>
</html>
