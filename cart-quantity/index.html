<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Cart Quantity - JS Variables</title>
  </head>
  <body>
    <h1>Cart Quantity Practice</h1>
    <p>Variable: cartQuantity (starts at 0)</p>
    <p>Open console (F12) to see logs</p>

    <button onclick="console.log('Cart quantity: ' + cartQuantity)">
      Show quantity
    </button>
    <button
      onclick="
        cartQuantity = cartQuantity + 1;
        console.log('Added 1. Cart quantity: ' + cartQuantity);
      "
    >
      add to cart
    </button>
    <button
      onclick="
        cartQuantity = cartQuantity + 2;
        console.log('Added 2. Cart quantity: ' + cartQuantity);
      "
    >
      +2
    </button>
    <button
      onclick="
        cartQuantity = cartQuantity + 3;
        console.log('Added 3. Cart quantity: ' + cartQuantity);
      "
    >
      +3
    </button>
    <button
      onclick="
        cartQuantity = 0;
        console.log('Cart was reset');
        console.log('Cart quantity: ' + cartQuantity);
      "
    >
      reset cart
    </button>

    <script>
      let cartQuantity = 0;
    </script>
  </body>
</html>
