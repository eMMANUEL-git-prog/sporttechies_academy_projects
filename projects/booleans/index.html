<!doctype html>
<html>
  <head>
    <title>Booleans Project</title>
    <style>
      .final-project-link {
        margin-top: 50px;
      }
    </style>
  </head>
  <body>
    <p>Rock Paper Scissors</p>

    <button
      onclick="
        let computerMove;
        const randomNumber = Math.random();

        if (randomNumber >= 0 && randomNumber < 1 / 3) {
          computerMove = 'rock';
        } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
          computerMove = 'paper';
        } else {
          computerMove = 'scissors';
        }

        const message = `You picked rock. Computer picked ${computerMove}.`;

        if (computerMove === 'rock') {
          alert(`${message} Tie.`);
        } else if (computerMove === 'paper') {
          alert(`${message} You lose.`);
        } else {
          alert(`${message} You win.`);
        }
      "
    >
      Rock
    </button>

    <button
      onclick="
        let computerMove;
        const randomNumber = Math.random();

        if (randomNumber >= 0 && randomNumber < 1 / 3) {
          computerMove = 'rock';
        } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
          computerMove = 'paper';
        } else {
          computerMove = 'scissors';
        }

        const message = `You picked paper. Computer picked ${computerMove}.`;

        if (computerMove === 'rock') {
          alert(`${message} You win.`);
        } else if (computerMove === 'paper') {
          alert(`${message} Tie.`);
        } else {
          alert(`${message} You lose.`);
        }
      "
    >
      Paper
    </button>

    <button
      onclick="
        let computerMove;
        const randomNumber = Math.random();

        if (randomNumber >= 0 && randomNumber < 1 / 3) {
          computerMove = 'rock';
        } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
          computerMove = 'paper';
        } else {
          computerMove = 'scissors';
        }

        const message = `You picked scissors. Computer picked ${computerMove}.`;

        if (computerMove === 'rock') {
          alert(`${message} You lose.`);
        } else if (computerMove === 'paper') {
          alert(`${message} You win.`);
        } else {
          alert(`${message} Tie.`);
        }
      "
    >
      Scissors
    </button>

    <p class="final-project-link">
      <a href="https://academy.sporttechies.com/projects/rock-paper-scissors"
        >Click here</a
      >
      to see the final version of the project.
    </p>
  </body>
</html>
